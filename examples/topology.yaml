apiVersion: airgap.example.com/v1alpha1
kind: Org
metadata:
  name: org-a
spec:
  displayName: Org A
  description: Secure production fleet for org-a
  contact: ops-a@example.com
---
apiVersion: airgap.example.com/v1alpha1
kind: Rack
metadata:
  name: rack-a1
spec:
  orgRef: org-a
  location: dc-1
  row: row-1
  floor: floor-1
---
apiVersion: airgap.example.com/v1alpha1
kind: Tor
metadata:
  name: tor-a1
spec:
  orgRef: org-a
  rackRef: rack-a1
  managementIP: 10.10.0.10
  model: QFX5120
---
apiVersion: airgap.example.com/v1alpha1
kind: Subnet
metadata:
  name: subnet-org-a-prod
spec:
  orgRef: org-a
  cidr: 10.10.0.0/24
  gateway: 10.10.0.1
  vlan: 100
  dnsServers:
    - 10.10.0.53
    - 10.10.0.54
---
apiVersion: airgap.example.com/v1alpha1
kind: Network
metadata:
  name: org-a-prod-net
spec:
  description: Production network for org-a
  enabled: true
  networkRef: org-a
  cidr: 10.10.0.0/24
  type: bridge
  address: 10.10.0.1
---
apiVersion: airgap.example.com/v1alpha1
kind: Router
metadata:
  name: org-a-edge-router
spec:
  description: Egress router for org-a production subnet
  enabled: true
  networkRef: org-a-prod-net
  cidr: 10.10.0.0/24
  type: edge
  address: 10.10.0.2
---
apiVersion: airgap.example.com/v1alpha1
kind: RouteTable
metadata:
  name: org-a-routes
spec:
  description: Route table for org-a workers and admin nodes
  enabled: true
  networkRef: org-a-prod-net
  cidr: 10.10.0.0/24
  type: main
  address: 10.10.0.1
---
apiVersion: airgap.example.com/v1alpha1
kind: Server
metadata:
  name: org-a-admin-01
spec:
  orgRef: org-a
  rackRef: rack-a1
  torRef: tor-a1
  subnetRef: subnet-org-a-prod
  hostname: org-a-admin-01.airgap.local
  role: admin
  ipAddress: 10.10.0.11
  os: Ubuntu 22.04
  serialNumber: SN-A-001
---
apiVersion: airgap.example.com/v1alpha1
kind: Server
metadata:
  name: org-a-admin-02
spec:
  orgRef: org-a
  rackRef: rack-a1
  torRef: tor-a1
  subnetRef: subnet-org-a-prod
  hostname: org-a-admin-02.airgap.local
  role: admin
  ipAddress: 10.10.0.12
  os: Ubuntu 22.04
  serialNumber: SN-A-002
---
apiVersion: airgap.example.com/v1alpha1
kind: Server
metadata:
  name: org-a-admin-03
spec:
  orgRef: org-a
  rackRef: rack-a1
  torRef: tor-a1
  subnetRef: subnet-org-a-prod
  hostname: org-a-admin-03.airgap.local
  role: admin
  ipAddress: 10.10.0.13
  os: Ubuntu 22.04
  serialNumber: SN-A-003
---
apiVersion: airgap.example.com/v1alpha1
kind: Server
metadata:
  name: org-a-worker-01
spec:
  orgRef: org-a
  rackRef: rack-a1
  torRef: tor-a1
  subnetRef: subnet-org-a-prod
  hostname: org-a-worker-01.airgap.local
  role: worker
  ipAddress: 10.10.0.14
  os: Ubuntu 22.04
  serialNumber: SN-A-101
---
