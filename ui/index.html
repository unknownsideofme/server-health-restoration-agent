<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirGap Autonomous AI NOC Copilot (React 18)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(17, 24, 39, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --status-healthy: #10b981;
      --status-degraded: #f59e0b;
      --status-critical: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--status-healthy);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-healthy);
      box-shadow: 0 0 8px var(--status-healthy);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
    }

    .nav-tab {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active {
      color: #fff;
      background: rgba(6, 182, 212, 0.2);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
    }

    select {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .org-section-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .org-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .org-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .org-badge {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-blue);
    }

    .sub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .sub-section {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
    }

    .sub-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .topo-item {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .topo-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
    }

    .topo-item.status-HEALTHY { border-left: 4px solid var(--status-healthy); }
    .topo-item.status-DEGRADED { border-left: 4px solid var(--status-degraded); background: rgba(245, 158, 11, 0.08); }
    .topo-item.status-CRITICAL { border-left: 4px solid var(--status-critical); background: rgba(239, 68, 68, 0.08); }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .item-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-pill.HEALTHY { background: rgba(16,185,129,0.2); color: var(--status-healthy); }
    .status-pill.DEGRADED { background: rgba(245,158,11,0.2); color: var(--status-degraded); }
    .status-pill.CRITICAL { background: rgba(239,68,68,0.2); color: var(--status-critical); }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .metric-val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: rgba(30, 41, 59, 0.6);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.15);
    }

    .btn-danger {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.15);
    }

    .btn-clear {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.15);
    }

    .copilot-output {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 14px;
      min-height: 200px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.6;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [orgFilter, setOrgFilter] = useState('ALL');
      const [telemetry, setTelemetry] = useState(null);
      const [copilotText, setCopilotText] = useState('Select a component or type a query to invoke React 18 Local LLM decision support...');
      const [userPrompt, setUserPrompt] = useState('');
      const [lastSync, setLastSync] = useState('Syncing...');

      useEffect(() => {
        fetchTelemetryData();
        const interval = setInterval(fetchTelemetryData, 2500);
        return () => clearInterval(interval);
      }, []);

      const fetchTelemetryData = async () => {
        try {
          const res = await fetch('/api/telemetry');
          const data = await res.json();
          setTelemetry(data);
          setLastSync(new Date().toLocaleTimeString());
        } catch (err) {
          console.error(err);
        }
      };

      const handleSelectComponent = async (name) => {
        setCopilotText(`Querying Local LLM Daemon for component '${name}'...`);
        try {
          const res = await fetch(`/api/copilot?target=${name}`);
          const data = await res.json();
          const out = `=== AIRGAP AI NOC COPILOT DECISION SUPPORT (React 18) ===
Target Component: ${data.component} (Status: ${data.status} | Risk: ${data.risk_score}%)

Q1: WHAT IS LIKELY TO FAIL NEXT — AND WHEN?
${data.q1_forecast}

Q2: WHY IS RISK ASSESSED AS ELEVATED — WHICH SIGNALS CONTRIBUTED?
${data.q2_reasoning}

Q3: WHAT CORRECTIVE ACTION SHOULD BE TAKEN BEFORE SLA IMPACT?
${data.q3_corrective_action}

LLM INSIGHT (qwen2.5:0.5b Daemon Port 11435):
${data.llm_insight}`;
          setCopilotText(out);
        } catch (e) {
          setCopilotText("Error fetching Copilot decision support.");
        }
      };

      const handleSendPrompt = async () => {
        if (!userPrompt) return;
        const promptCopy = userPrompt;
        setUserPrompt('');
        setCopilotText('Querying Dedicated Local LLM Daemon (Port 11435)...');
        try {
          const res = await fetch('/api/copilot/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: promptCopy })
          });
          const data = await res.json();
          setCopilotText(data.answer);
        } catch (e) {
          setCopilotText("Error querying local LLM daemon.");
        }
      };

      const handleInjectFault = async (scenario) => {
        await fetch('/api/fault/inject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenario: scenario, target: 'org-a-edge-router' })
        });
        fetchTelemetryData();
        handleSelectComponent('org-a-edge-router');
      };

      const handleMCPFix = async (target = 'org-a-edge-router') => {
        setCopilotText(`Executing MCP Skill Autonomous Repair on ${target}...`);
        const res = await fetch('/api/mcp/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool_name: 'execute_autonomous_repair', arguments: { component_name: target } })
        });
        const data = await res.json();
        const resultObj = data.result ? data.result.result : {};
        const actions = resultObj.actions ? resultObj.actions.join('\n- ') : 'Autonomous repair completed.';
        setCopilotText(`=== MCP AGENT AUTONOMOUS REPAIR RESULT ===\nTarget: ${target}\nStatus: COMPLETED\n\nActions Taken:\n- ` + actions);
        fetchTelemetryData();
      };

      const handleClearFaults = async () => {
        await fetch('/api/fault/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        fetchTelemetryData();
      };

      return (
        <div>
          <header>
            <div class="brand">
              <div class="brand-icon">React</div>
              <div>
                <div class="brand-title">Autonomous Air-Gapped NOC Copilot</div>
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>React 18 SPA Architecture & K8s CRD Event Synchronization</div>
              </div>
            </div>
            <div class="live-badge">
              <div class="live-dot"></div>
              <span>Live Telemetry ● {lastSync}</span>
            </div>
          </header>

          {/* Navigation Bar */}
          <div class="nav-bar">
            <div class="nav-tabs">
              <div class={`nav-tab ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}>📊 Global Overview</div>
              <div class={`nav-tab ${activeTab === 'orgs' ? 'active' : ''}`} onClick={() => setActiveTab('orgs')}>🏢 Organizations</div>
              <div class={`nav-tab ${activeTab === 'servers' ? 'active' : ''}`} onClick={() => setActiveTab('servers')}>🖥️ Control Plane & Workloads</div>
              <div class={`nav-tab ${activeTab === 'tors' ? 'active' : ''}`} onClick={() => setActiveTab('tors')}>🔀 TOR Switches</div>
              <div class={`nav-tab ${activeTab === 'racks' ? 'active' : ''}`} onClick={() => setActiveTab('racks')}>🗄️ Infrastructure Racks</div>
              <div class={`nav-tab ${activeTab === 'routers' ? 'active' : ''}`} onClick={() => setActiveTab('routers')}>🌐 Edge Routers</div>
            </div>

            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
              <span style={{fontSize: '12px', color: 'var(--text-muted)'}}>Scope Filter:</span>
              <select value={orgFilter} onChange={(e) => setOrgFilter(e.target.value)}>
                <option value="ALL">All Organizations</option>
                <option value="org-a">Org A (10.10.0.0/24)</option>
                <option value="org-b">Org B (10.11.0.0/24)</option>
                <option value="org-c">Org C (10.12.0.0/24)</option>
                <option value="org-d">Org D (10.13.0.0/24)</option>
              </select>
            </div>
          </div>

          <div class="main-grid">
            <div>
              <div class="card">
                <div class="card-title">
                  <span>{activeTab.toUpperCase()} View Matrix</span>
                  <span style={{fontSize: '11px', color: 'var(--text-muted)'}}>Click any component to inspect telemetry</span>
                </div>
                
                <ViewRenderer 
                  activeTab={activeTab} 
                  orgFilter={orgFilter} 
                  telemetry={telemetry} 
                  onSelect={handleSelectComponent} 
                />
              </div>

              <div class="card">
                <div class="card-title">
                  <span>AI Copilot Decision Support (Q1, Q2, Q3)</span>
                  <span style={{fontSize: '11px', padding: '2px 8px', borderRadius: '10px', background: 'rgba(6,182,212,0.2)', color: 'var(--accent-cyan)'}}>Local LLM Daemon (Port 11435)</span>
                </div>
                <div class="copilot-output">{copilotText}</div>
                <div class="chat-input-row">
                  <input 
                    type="text" 
                    value={userPrompt} 
                    onChange={(e) => setUserPrompt(e.target.value)} 
                    onKeyDown={(e) => e.key === 'Enter' && handleSendPrompt()} 
                    placeholder="Ask NOC Copilot (e.g. 'What is likely to fail next?')" 
                  />
                  <button class="btn" onClick={handleSendPrompt}>Ask Copilot</button>
                </div>
              </div>
            </div>

            <div>
              <div class="card">
                <div class="card-title">Fault Injection Control Panel</div>
                <div class="btn-group">
                  <button class="btn btn-danger" onClick={() => handleInjectFault('congestion')}>
                    <span>⚡ Progressive Congestion</span>
                    <span style={{fontSize: '10px'}}>(org-a-edge-router)</span>
                  </button>
                  <button class="btn btn-danger" onClick={() => handleInjectFault('route_flap')}>
                    <span>⚡ BGP Route Flap Cascade</span>
                    <span style={{fontSize: '10px'}}>(tor-a1)</span>
                  </button>
                  <button class="btn btn-danger" onClick={() => handleInjectFault('tunnel_deg')}>
                    <span>⚡ Tunnel Degradation</span>
                    <span style={{fontSize: '10px'}}>(org-a-edge-router)</span>
                  </button>
                  <button class="btn btn-danger" onClick={() => handleInjectFault('policy_drift')}>
                    <span>⚡ Policy Drift</span>
                    <span style={{fontSize: '10px'}}>(org-a-edge-router)</span>
                  </button>
                  <button class="btn btn-clear" style={{borderColor: 'rgba(6,182,212,0.5)', background: 'rgba(6,182,212,0.15)'}} onClick={() => handleMCPFix()}>
                    <span>🛠️ Execute Autonomous Repair (MCP Skill)</span>
                  </button>
                  <button class="btn btn-clear" onClick={handleClearFaults}>
                    <span>✓ Clear All Active Faults</span>
                  </button>
                </div>
              </div>

              <div class="card">
                <div class="card-title">Active Predictive Alerts</div>
                <div style={{fontSize: '12px'}}>
                  {telemetry && telemetry.alerts && telemetry.alerts.length > 0 ? (
                    telemetry.alerts.map((al, idx) => (
                      <div key={idx} style={{padding: '8px', marginBottom: '6px', borderRadius: '6px', background: 'rgba(239, 68, 68, 0.15)', border: '1px solid rgba(239, 68, 68, 0.3)'}}>
                        <div style={{fontWeight: 600, color: '#ef4444'}}>🚨 {al.issue_type}</div>
                        <div style={{fontSize: '11px', marginTop: '2px'}}>{al.summary}</div>
                        <div style={{fontSize: '10px', color: '#9ca3af', marginTop: '2px'}}>TTI: {al.tti_minutes} mins | Conf: {Math.round(al.confidence*100)}%</div>
                      </div>
                    ))
                  ) : (
                    <div style={{color: 'var(--text-muted)', fontStyle: 'italic'}}>No critical predictive alerts active.</div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ViewRenderer({ activeTab, orgFilter, telemetry, onSelect }) {
      if (!telemetry || !telemetry.by_org) return <div>Loading live telemetry matrix...</div>;

      const by_org = telemetry.by_org;
      const orgKeys = Object.keys(by_org).sort().filter(k => orgFilter === 'ALL' || k === orgFilter);

      if (activeTab === 'servers') {
        return (
          <div>
            {orgKeys.map(orgKey => (
              <div key={orgKey} class="org-section-card">
                <div class="org-header">
                  <div class="org-title">🖥️ Servers for {by_org[orgKey].name}</div>
                </div>
                <div class="sub-grid">
                  <div class="sub-section">
                    <div class="sub-title">🛡️ Control Plane / Admin Nodes</div>
                    <ComponentList items={by_org[orgKey].admin_servers} onSelect={onSelect} />
                  </div>
                  <div class="sub-section">
                    <div class="sub-title">⚙️ Compute / Workload Nodes</div>
                    <ComponentList items={by_org[orgKey].worker_servers} onSelect={onSelect} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      }

      return (
        <div>
          {orgKeys.map(orgKey => {
            const orgData = by_org[orgKey];
            return (
              <div key={orgKey} class="org-section-card">
                <div class="org-header">
                  <div class="org-title">🏢 {orgData.name}</div>
                  <div class="org-badge">Subnet: 10.{10 + ['org-a', 'org-b', 'org-c', 'org-d'].indexOf(orgKey)}.0.0/24</div>
                </div>
                <div class="sub-grid">
                  <div class="sub-section">
                    <div class="sub-title">🌐 Edge Router & Subnet</div>
                    <ComponentList items={orgData.routers.concat(orgData.subnets)} onSelect={onSelect} />
                  </div>
                  <div class="sub-section">
                    <div class="sub-title">🔀 TOR Switch & Rack</div>
                    <ComponentList items={orgData.tors.concat(orgData.racks)} onSelect={onSelect} />
                  </div>
                  <div class="sub-section">
                    <div class="sub-title">🛡️ Admin Control Plane</div>
                    <ComponentList items={orgData.admin_servers} onSelect={onSelect} />
                  </div>
                  <div class="sub-section">
                    <div class="sub-title">⚙️ Workload Compute</div>
                    <ComponentList items={orgData.worker_servers} onSelect={onSelect} />
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function ComponentList({ items, onSelect }) {
      if (!items || items.length === 0) return <div style={{fontSize: '11px', color: 'var(--text-muted)', fontStyle: 'italic'}}>None</div>;
      return (
        <div>
          {items.map(item => {
            const tti_html = item.tti_minutes ? <span style={{color: '#ef4444', fontWeight: 'bold'}}>TTI: {item.tti_minutes}m</span> : 'Nominal';
            const util = item.current_metrics ? item.current_metrics.interface_utilization_pct : 25.0;
            const lat = item.current_metrics ? item.current_metrics.latency_ms : 2.5;
            const loss = item.current_metrics ? item.current_metrics.packet_loss_pct : 0.0;
            return (
              <div key={item.name} class={`topo-item status-${item.status}`} onClick={() => onSelect(item.name)}>
                <div class="item-header">
                  <span class="item-name">{item.name}</span>
                  <span class={`status-pill ${item.status}`}>{item.status}</span>
                </div>
                <div class="metric-row"><span>Risk Score:</span><span class="metric-val">{item.risk_score || 15}%</span></div>
                <div class="metric-row"><span>Bandwidth Util:</span><span class="metric-val">{util}%</span></div>
                <div class="metric-row"><span>Latency / Loss:</span><span class="metric-val">{lat}ms / {loss}%</span></div>
                <div class="metric-row"><span>Lead Time (TTI):</span><span class="metric-val">{tti_html}</span></div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
