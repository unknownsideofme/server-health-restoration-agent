apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: airgap-operator
rules:
  - apiGroups: ["airgap.example.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
