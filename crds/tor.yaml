apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tors.airgap.example.com
spec:
  group: airgap.example.com
  scope: Cluster
  names:
    plural: tors
    singular: tor
    kind: Tor
    shortNames: ["tor"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Org
        type: string
        jsonPath: .spec.orgRef
      - name: ManagementIP
        type: string
        jsonPath: .spec.managementIP
      - name: Connected
        type: integer
        jsonPath: .status.connectedServerCount
      - name: Phase
        type: string
        jsonPath: .status.phase
      - name: Ready
        type: boolean
        jsonPath: .status.ready
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["orgRef", "rackRef", "managementIP"]
              properties:
                orgRef:
                  type: string
                rackRef:
                  type: string
                managementIP:
                  type: string
                model:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                phase:
                  type: string
                observedGeneration:
                  type: integer
                connectedServerCount:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
