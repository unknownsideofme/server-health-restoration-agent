apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboards.airgap.example.com
spec:
  group: airgap.example.com
  names:
    kind: Dashboard
    plural: dashboards
    singular: dashboard
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              title:
                type: string
              port:
                type: integer
              url:
                type: string
              framework:
                type: string
              enabled:
                type: boolean
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              phase:
                type: string
              ready:
                type: boolean
              observedGeneration:
                type: integer
              lastLifecycleUpdate:
                type: string
              healthScore:
                type: number
              conditions:
                type: array
                items:
                  type: object
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Framework
      type: string
      jsonPath: .spec.framework
    - name: Port
      type: integer
      jsonPath: .spec.port
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
