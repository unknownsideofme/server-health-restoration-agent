apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmmodels.airgap.example.com
spec:
  group: airgap.example.com
  names:
    kind: LLMModel
    plural: llmmodels
    singular: llmmodel
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              modelName:
                type: string
              provider:
                type: string
              endpoint:
                type: string
              port:
                type: integer
              airgapped:
                type: boolean
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              phase:
                type: string
              ready:
                type: boolean
              observedGeneration:
                type: integer
              lastLifecycleUpdate:
                type: string
              healthScore:
                type: number
              inferenceLatencyMs:
                type: number
              conditions:
                type: array
                items:
                  type: object
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Model
      type: string
      jsonPath: .spec.modelName
    - name: Provider
      type: string
      jsonPath: .spec.provider
    - name: Port
      type: integer
      jsonPath: .spec.port
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
