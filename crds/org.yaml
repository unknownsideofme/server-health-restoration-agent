apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orgs.airgap.example.com
spec:
  group: airgap.example.com
  scope: Cluster
  names:
    plural: orgs
    singular: org
    kind: Org
    shortNames: ["org"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: DisplayName
        type: string
        jsonPath: .spec.displayName
      - name: Phase
        type: string
        jsonPath: .status.phase
      - name: Ready
        type: boolean
        jsonPath: .status.ready
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["displayName"]
              properties:
                displayName:
                  type: string
                description:
                  type: string
                contact:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                phase:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
  conversion:
    strategy: None
