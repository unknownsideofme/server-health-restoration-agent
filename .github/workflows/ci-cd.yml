name: AirGap Autonomous AI NOC Copilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Validate CRDs & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kubernetes pyyaml prometheus_client

    - name: Validate Python Syntax across Codebase
      run: |
        python -m compileall pkg/ controllers/ ui/ scripts/ test/

    - name: Validate Kubernetes Custom Resource Definitions (CRDs)
      run: |
        sudo snap install kubectl --classic
        kubectl apply --dry-run=client -f crds/org.yaml
        kubectl apply --dry-run=client -f crds/rack.yaml
        kubectl apply --dry-run=client -f crds/tor.yaml
        kubectl apply --dry-run=client -f crds/subnet.yaml
        kubectl apply --dry-run=client -f crds/server.yaml
        kubectl apply --dry-run=client -f crds/network.yaml
        kubectl apply --dry-run=client -f crds/router.yaml
        kubectl apply --dry-run=client -f crds/routetable.yaml
        kubectl apply --dry-run=client -f crds/dashboard.yaml
        kubectl apply --dry-run=client -f crds/llmmodel.yaml

    - name: Run MCP Skill Unit Tests
      run: |
        python test/test_mcp_skills.py
