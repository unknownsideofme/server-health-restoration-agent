name: AirGap Unit Tests Pipeline (ut)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-unit-tests-ut:
    name: Run Dedicated Unit Test Suites (ut)
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kubernetes pyyaml prometheus_client

    - name: Run Telemetry Pipeline Unit Tests (ut)
      run: |
        python test/test_pipeline_ut.py

    - name: Run Agent Skills & MCP Unit Tests (ut)
      run: |
        python test/test_skills_ut.py

    - name: Run Operator Controller Predictive Unit Tests (ut)
      run: |
        python test/test_controller_ut.py
