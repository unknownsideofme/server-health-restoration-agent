name: AirGap End-to-End Integration Pipeline (e2e)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-e2e-tests-e2e:
    name: Run Dedicated End-to-End Integration Suites (e2e)
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kubernetes pyyaml prometheus_client

    - name: Validate 10 Kubernetes CRDs (e2e)
      run: |
        sudo snap install kubectl --classic
        kubectl apply --dry-run=client --validate=false -f crds/org.yaml
        kubectl apply --dry-run=client --validate=false -f crds/rack.yaml
        kubectl apply --dry-run=client --validate=false -f crds/tor.yaml
        kubectl apply --dry-run=client --validate=false -f crds/subnet.yaml
        kubectl apply --dry-run=client --validate=false -f crds/server.yaml
        kubectl apply --dry-run=client --validate=false -f crds/network.yaml
        kubectl apply --dry-run=client --validate=false -f crds/router.yaml
        kubectl apply --dry-run=client --validate=false -f crds/routetable.yaml
        kubectl apply --dry-run=client --validate=false -f crds/dashboard.yaml
        kubectl apply --dry-run=client --validate=false -f crds/llmmodel.yaml


    - name: Start LLM Daemon (e2e)
      run: |
        python pkg/copilot/llm_daemon.py &
        sleep 2

    - name: Start Web Server (e2e)
      run: |
        python ui/server.py &
        sleep 2

    - name: Run Web UI & Telemetry Exporter E2E Tests (e2e)
      run: |
        python test/test_dashboard_e2e.py

    - name: Run Local LLM Daemon & MCP E2E Tests (e2e)
      run: |
        python test/test_llm_mcp_e2e.py

